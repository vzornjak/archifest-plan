name: ArchifestPlan

# xcodegen spec — generates ArchifestPlan.xcodeproj. Regenerate after adding or
# removing files: `cd ios && xcodegen generate`. Do not hand-edit the .xcodeproj.
options:
  bundleIdPrefix: hr.archifest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  ArchifestPlan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # NOTE: xcodegen has no separate top-level "resources" target key (an
    # earlier version of this file assumed one, and xcodegen silently
    # ignored it — Assets.xcassets/Fixtures never made it into the bundle).
    # Resources are declared here, in `sources`, tagged `buildPhase: resources`.
    sources:
      - path: ArchifestPlan/App
      - path: ArchifestPlan/Capture
      - path: ArchifestPlan/Report
      - path: ArchifestPlan/Models
      - path: ArchifestPlan/Resources/Assets.xcassets
        buildPhase: resources
      - path: ArchifestPlan/Fixtures
        buildPhase: resources

    # xcodegen generates Info.plist itself from these properties (and
    # overwrites any file at `path` on every `generate` run) — do not
    # hand-maintain ios/ArchifestPlan/Resources/Info.plist, edit this instead.
    info:
      path: ArchifestPlan/Resources/Info.plist
      properties:
        CFBundleDisplayName: ARCHIFEST Plan
        CFBundleDevelopmentRegion: hr
        # RoomPlan capture uses the camera (via ARKit) for the LiDAR scan.
        # The scan never leaves the device — same zero-network guarantee as
        # the web report, see CLAUDE.md.
        NSCameraUsageDescription: >-
          Kamera se koristi za 3D snimanje prostorije pomoću RoomPlan-a.
          Snimka ostaje na uređaju.
        # Compass heading only, for true-north on the floor plan — see
        # headingDegrees in meta.json and HEADING_OFFSET_DEG in geometry.js.
        # Never leaves the device.
        NSLocationWhenInUseUsageDescription: >-
          Smjer kompasa (sjever) se koristi za orijentaciju tlocrta.
          Lokacija ostaje na uređaju.
        UIRequiredDeviceCapabilities:
          - arkit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hr.archifest.plan
        PRODUCT_NAME: ArchifestPlan
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO

    # Copies the four shared web files from the repo root into the app bundle
    # at build time, so the app can never ship maths that's out of sync with
    # the web report. Fails the build (rather than shipping a stale/missing
    # copy) if a file has gone missing or been renamed at the repo root.
    preBuildScripts:
      - name: "Copy web report files"
        shell: /bin/sh
        script: |
          set -e
          SRC="$SRCROOT/.."
          DEST="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DEST"
          for f in index.html app.js geometry.js style.css; do
            if [ ! -f "$SRC/$f" ]; then
              echo "error: missing $SRC/$f — the web report cannot be bundled" >&2
              exit 1
            fi
            cp "$SRC/$f" "$DEST/$f"
          done
        inputFiles:
          - $(SRCROOT)/../index.html
          - $(SRCROOT)/../app.js
          - $(SRCROOT)/../geometry.js
          - $(SRCROOT)/../style.css
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/index.html
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/app.js
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/geometry.js
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/style.css

schemes:
  ArchifestPlan:
    build:
      targets:
        ArchifestPlan: all
    run:
      config: Debug
    archive:
      config: Release
